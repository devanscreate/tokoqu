services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tokoqu-pos-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-pos.ini:ro
      - pos_backups:/var/backups/pos
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-tokoqu_pos}
      DB_USERNAME: ${DB_USERNAME:-tokoqu}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: tokoqu-pos-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-pos.ini:ro
    depends_on:
      - app
      - postgres

  scheduler:
    image: tokoqu-pos-app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-pos.ini:ro
      - pos_backups:/var/backups/pos
    depends_on:
      - app
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tokoqu_pos}
      POSTGRES_USER: ${DB_USERNAME:-tokoqu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - pos_backups:/var/backups/pos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tokoqu} -d ${DB_DATABASE:-tokoqu_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  pos_backups:
  caddy_data:
  caddy_config:

